  }

  html,body{background:transparent}
  body{

  }

  .foot{max-width:420px;width:100%;color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px;line-height:1.6}

  // screen switch
  function go(s){
    document.querySelectorAll('.screen').forEach(function(el){el.classList.remove('on')});
    document.getElementById('s-'+s).classList.add('on');
    document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.s===s)});
    document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.s===s)});
  }
  document.querySelectorAll('#seg button, #nav button').forEach(function(b){
    b.addEventListener('click',function(){go(b.dataset.s)});
  });

  // single-select chips
  document.querySelectorAll('.chips[data-single]').forEach(function(g){

        c.classList.add('on');
      });
    });
  });

  function doConnect(){
    var btn=document.getElementById('connectBtn'), txt=document.getElementById('connectTxt'),
        sync=document.getElementById('syncTxt');
    if(btn.classList.contains('done'))return;
    btn.className='connect loading'; txt.textContent='연동 중…';

    document.getElementById('varList').style.display = which==='var'?'block':'none';

  }
